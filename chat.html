<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBSE Class 9 Tutor</title>
  <style>
    body { font-family: Segoe UI, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px; color: #17202a; background: #f4f7fa; }
    h1 { margin-bottom: 6px; }
    .hint { color: #65727e; }
    #messages { min-height: 280px; border: 1px solid #ccd4dc; border-radius: 8px; padding: 16px; margin: 20px 0; background: white; }
    .message { margin: 12px 0; padding: 12px 14px; border-radius: 8px; white-space: normal; }
    .user { color: #135d9e; background: #eef6ff; }
    .assistant { color: #1f6b45; background: #f0faf4; line-height: 1.55; }
    .assistant h2, .assistant h3 { margin: 8px 0 4px; color: #174d37; }
    .assistant p { margin: 8px 0; }
    .assistant ul, .assistant ol { margin: 6px 0 10px 22px; padding: 0; }
    .assistant code { background: #e4eee8; padding: 2px 4px; border-radius: 3px; }
    .sources { margin-top: 12px; font-size: 0.9em; }
    .sources a { color: #135d9e; margin-right: 12px; }
    form { display: grid; gap: 10px; }
    input, select, button { font: inherit; padding: 10px; border: 1px solid #aeb8c2; border-radius: 6px; }
    button { background: #135d9e; color: white; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    #practice { margin-top: 24px; padding-top: 20px; border-top: 1px solid #ccd4dc; }
    #practice-items { display: grid; gap: 12px; margin-top: 14px; }
    .practice-card { padding: 14px; border: 1px solid #ccd4dc; border-radius: 8px; background: #fff; }
    .practice-card h3 { margin: 0 0 8px; color: #174d37; }
    .practice-card textarea { width: 100%; min-height: 70px; box-sizing: border-box; margin: 10px 0; }
    .choices { display: grid; gap: 6px; margin: 10px 0; }
    .choices label { padding: 8px; background: #f4f7fa; border-radius: 5px; }
    .practice-feedback { margin-top: 8px; font-weight: 600; }
    .source-note { color: #65727e; font-size: 0.9em; }
    @media (max-width: 600px) { body { padding: 16px; } }
  </style>
</head>
<body>
  <h1>CBSE Class 9 Tutor</h1>
  <div class="hint">Ask questions grounded in your local textbooks.</div>
  <div id="messages"><div class="message assistant">Ready. Select a subject and ask a question.</div></div>
  <form id="chat-form">
    <select id="subject">
      <option value="">All subjects</option>
      <option>Mathematics</option><option>Science</option><option>Social Science</option>
      <option>English</option><option>Hindi</option><option>Skill</option>
    </select>
    <div class="row">
      <input id="question" required placeholder="Ask a Class 9 question...">
      <button type="submit">Ask</button>
    </div>
  </form>
  <section id="practice">
    <h2>Practice Lab</h2>
    <div class="hint">Test recall, recognition, explanation, and teaching. Every item is built from the indexed textbook.</div>
    <form id="practice-form">
      <select id="practice-mode">
        <option value="mixed">Mixed practice</option>
        <option value="flashcards">Flashcards</option>
        <option value="mcq">Multiple choice</option>
        <option value="short_answer">Short answer</option>
        <option value="teach_back">Teach-back</option>
      </select>
      <div class="row">
        <input id="practice-topic" required placeholder="Topic to practise...">
        <button type="submit">Build set</button>
      </div>
    </form>
    <div id="practice-items"></div>
  </section>
  <script>
    const messages = document.getElementById('messages');
    let pendingMessage = null;
    let practiceItems = [];

    function addTextWithInlineCode(parent, text) {
      text.split(/(`[^`]+`|\*\*[^*]+\*\*)/g).forEach(part => {
        if (part.startsWith('`') && part.endsWith('`')) {
          const code = document.createElement('code');
          code.textContent = part.slice(1, -1);
          parent.appendChild(code);
        } else if (part.startsWith('**') && part.endsWith('**')) {
          const strong = document.createElement('strong');
          strong.textContent = part.slice(2, -2);
          parent.appendChild(strong);
        } else {
          parent.appendChild(document.createTextNode(part));
        }
      });
    }

    function renderAnswer(text) {
      const container = document.createElement('div');
      container.className = 'message assistant';
      let paragraph = null;
      let list = null;
      text.split(/\r?\n/).forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) { paragraph = null; list = null; return; }
        const heading = trimmed.match(/^#{2,3}\s+(.+)/);
        const bullet = trimmed.match(/^[-*]\s+(.+)/);
        const numbered = trimmed.match(/^\d+[.)]\s+(.+)/);
        const label = !heading && !bullet && !numbered && trimmed.match(/^([^.!?]{2,70}):$/);
        if (heading || label) {
          const element = document.createElement(trimmed.startsWith('###') ? 'h3' : 'h2');
          addTextWithInlineCode(element, heading ? heading[1] : label[1]);
          container.appendChild(element);
          paragraph = null; list = null;
        } else if (bullet || numbered) {
          const ordered = Boolean(numbered);
          if (!list || list.tagName.toLowerCase() !== (ordered ? 'ol' : 'ul')) {
            list = document.createElement(ordered ? 'ol' : 'ul');
            container.appendChild(list);
          }
          const item = document.createElement('li');
          addTextWithInlineCode(item, (bullet || numbered)[1]);
          list.appendChild(item);
          paragraph = null;
        } else {
          if (!paragraph) {
            paragraph = document.createElement('p');
            container.appendChild(paragraph);
          } else {
            paragraph.appendChild(document.createTextNode(' '));
          }
          addTextWithInlineCode(paragraph, trimmed);
          list = null;
        }
      });
      return container;
    }

    function renderSources(sources) {
      if (!sources || !sources.length) return null;
      const container = document.createElement('div');
      container.className = 'sources';
      sources.forEach(source => {
        const link = document.createElement('a');
        link.href = source.url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = `${source.source_file}, page ${source.page}`;
        container.appendChild(link);
      });
      return container;
    }

    function renderPracticeSet(data) {
      const container = document.getElementById('practice-items');
      container.textContent = '';
      practiceItems = data.items || [];
      if (!practiceItems.length) {
        container.textContent = data.message || 'No practice items found.';
        return;
      }
      practiceItems.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'practice-card';
        const title = document.createElement('h3');
        title.textContent = `${index + 1}. ${item.type.replace('_', ' ')}`;
        card.appendChild(title);
        const prompt = document.createElement('p');
        prompt.textContent = item.prompt;
        card.appendChild(prompt);
        if (item.type === 'mcq') {
          const choices = document.createElement('div');
          choices.className = 'choices';
          item.choices.forEach((choice, choiceIndex) => {
            const label = document.createElement('label');
            const radio = document.createElement('input');
            radio.type = 'radio'; radio.name = `practice-${item.id}`; radio.value = choiceIndex + 1;
            label.append(radio, ` ${choice}`); choices.appendChild(label);
          });
          card.appendChild(choices);
        } else {
          const input = document.createElement('textarea');
          input.id = `practice-response-${item.id}`;
          input.placeholder = 'Write your answer...';
          card.appendChild(input);
        }
        const button = document.createElement('button');
        button.type = 'button'; button.textContent = 'Check answer';
        button.addEventListener('click', () => checkPracticeAnswer(item, card));
        card.appendChild(button);
        const source = document.createElement('div');
        source.className = 'source-note';
        source.textContent = `${item.source.source_file}, page ${item.source.page}`;
        card.appendChild(source);
        container.appendChild(card);
      });
    }

    async function checkPracticeAnswer(item, card) {
      let response = '';
      if (item.type === 'mcq') {
        response = card.querySelector('input[type="radio"]:checked')?.value || '';
      } else {
        response = card.querySelector('textarea')?.value || '';
      }
      const result = await fetch('/practice/check', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({activity: item, response})
      }).then(response => response.json());
      let feedback = card.querySelector('.practice-feedback');
      if (!feedback) { feedback = document.createElement('div'); feedback.className = 'practice-feedback'; card.appendChild(feedback); }
      feedback.textContent = `${result.score ?? 0}/100 — ${result.feedback || result.error || 'No feedback.'}`;
      if (result.model_answer || result.explanation) {
        const detail = document.createElement('div');
        detail.textContent = `Source answer: ${result.model_answer || result.explanation}`;
        feedback.appendChild(detail);
      }
    }

    document.getElementById('practice-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const topic = document.getElementById('practice-topic').value.trim();
      const mode = document.getElementById('practice-mode').value;
      const container = document.getElementById('practice-items');
      container.textContent = 'Building practice set...';
      try {
        const response = await fetch('/practice', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({topic, mode, subject: document.getElementById('subject').value || null, count: 5})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to build practice set.');
        renderPracticeSet(data);
      } catch (error) { container.textContent = String(error); }
    });

    document.getElementById('chat-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const question = document.getElementById('question').value.trim();
      const subject = document.getElementById('subject').value || null;
      const userMessage = document.createElement('div');
      userMessage.className = 'message user';
      userMessage.textContent = `You: ${question}`;
      messages.appendChild(userMessage);
      pendingMessage = document.createElement('div');
      pendingMessage.className = 'message assistant';
      pendingMessage.textContent = 'Thinking...';
      messages.appendChild(pendingMessage);
      messages.scrollTop = messages.scrollHeight;
      document.getElementById('question').value = '';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 120000);
      try {
        const response = await fetch('/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question, subject}), signal: controller.signal });
        const data = await response.json();
        pendingMessage.replaceWith(renderAnswer(data.answer || data.error || 'No response returned.'));
        const sources = renderSources(data.sources);
        if (sources) messages.appendChild(sources);
      } catch (error) {
        const message = error.name === 'AbortError' ? 'The model took too long. Try qwen2.5:7b or ask a more specific question.' : error;
        pendingMessage.replaceWith(renderAnswer(String(message)));
      } finally {
        clearTimeout(timeout);
        pendingMessage = null;
      }
    });
  </script>
</body>
</html>
